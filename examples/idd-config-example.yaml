# IDD CLI Configuration
#
# Config search order:
#   1. --config flag value
#   2. ./.idd.yaml
#   3. ./.config/idd.yaml

version: "1.0"

# Documentation scan settings
docs:
  # Glob patterns for documentation files to scan
  patterns:
    - "docs/**/*.md"

  # Regex patterns to extract identifiers from docs
  identifier_patterns:
    spec: "SPEC-[A-Z]+-[0-9]+"
    test: "TEST-[A-Z]+-[0-9]+"
    test_contract: "TEST-[A-Z]+-[0-9]+"

  # Paths to ignore during scanning (glob patterns)
  ignore_paths:
    - "examples/**"

# Source code scan settings
code:
  # Glob patterns for source files to scan
  patterns:
    - "**/*.go"
    - "**/*.ts"
    - "**/*.tsx"
    - "**/*.js"

  # Annotation markers to look for in code
  annotations:
    - "@implement"
    - "@test"
    - "@test-contract"

  # Paths to ignore during scanning (glob patterns)
  ignore_paths: []

# Validation rules
validation:
  # Allow orphan identifiers (not linked from anywhere)
  allow_orphans: false

  # Require doc link consistency between specs and tests
  require_doc_link_consistency: true

  # Require all specs to have at least one test link
  require_spec_test_coverage: true

  # Require all contracts to have at least one @test-contract annotation
  require_contract_test_coverage: true

  # Require design.md files to contain required sections
  require_design_sections: true

  # Check doc describe field matches code function comment (default: true)
  require_doc_code_correspondence: true

  # Require public functions have @implement annotation
  require_public_func_annotation: true

  # Require package doc comment with Spec/Contract paths
  require_package_doc_comment: true

  # Require doc frontmatter has related_files section
  require_related_files: true

  # Require @implement/@test/@test-contract annotations have identifiers
  require_annotation_identifier: true

  # Require each pkg docs directory to contain spec.md, contract.md, testing.md, design.md
  require_pkg_doc_files: true

  # Require annotation types not split across consecutive lines
  # e.g., ALLOWED: // @test TEST-AUTH-001, TEST-AUTH-002
  # e.g., NOT ALLOWED: // @test TEST-AUTH-001 \n // @test TEST-AUTH-002
  require_annotation_on_same_line: true

  # Require test functions have @test or @test-contract annotation
  require_test_annotation: true

  # Semantic consistency check between doc describe and code comments
  consistency_check:
    enabled: true
    threshold: 0.3

# Output settings
output:
  # Output file path (default: stdout if empty, use -o flag to override)
  file: ""

  # Include full graph in report (default: false)
  include_graph: false

  # Verbose output (default: false)
  verbose: false