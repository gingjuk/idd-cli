# IDD CLI Configuration
#
# Config search order:
#   1. --config flag value
#   2. ./.idd.yaml
#   3. ./config/.idd.yaml
#
# This file mirrors config.Default() exactly. Configuration owns scan scope and
# validation policy only. Self-describing Markdown owns Components, Contracts,
# SPECs, TESTs, and their relationships. Declaration annotation identifiers are
# the code-to-document join keys; source-file document paths are not configured.

version: "1.0"

# Documentation scan settings
docs:
  # Glob patterns for documentation files to scan
  patterns:
    - "docs/**/*.md"

  # Regex patterns for SPEC and TEST identifiers.
  # Contract tests also own TEST IDs.
  identifier_patterns:
    spec: "SPEC-[A-Z]+-[0-9]+"
    test: "TEST-[A-Z]+-[0-9]+"
    test_contract: "TEST-[A-Z]+-[0-9]+"

  # Paths to ignore during scanning (glob patterns).
  # Repository examples are copyable references, not project-owned documents.
  ignore_paths:
    - "examples/**"
    - "cmd/idd-cli/skills/**"
    - "cmd/**"
    - "docs/architecture/**"
    - ".planning/**"

# Source code scan settings
code:
  # Glob patterns for source files to scan
  patterns:
    - "**/*.go"
    - "**/*.ts"
    - "**/*.tsx"
    - "**/*.js"
    - "**/*.jsx"
    - "**/*.cpp"
    - "**/*.cc"
    - "**/*.cxx"
    - "**/*.hpp"
    - "**/*.hh"
    - "**/*.hxx"
    - "**/*.java"
    - "**/*.py"

  # Annotation markers to look for in code (keyed by identifier type)
  annotations:
    spec: "@implement"
    test: "@test"
    test_contract: "@test-contract"

  # Paths to ignore during scanning (glob patterns)
  ignore_paths: []

# Validation rules
validation:
  # Allow orphan identifiers (not linked from anywhere)
  allow_orphans: false

  # Require declared document relationships to resolve consistently
  require_doc_link_consistency: true

  # Require legacy SPEC sections to carry their historical fixed fields.
  # Self-describing records always require Design, Contract, Requirement,
  # and Acceptance.
  require_spec_fields: true

  # Require every SPEC to be covered by at least one TEST
  require_spec_test_coverage: true

  # Require legacy CONTRACT markers and self-describing named Contracts to
  # have contract TEST evidence
  require_contract_test_coverage: true

  # Require authored content in every required design section
  require_design_sections: true

  # Join document records to declaration annotations by identifier and
  # require both sides.
  # Source-file Spec/Contract/Test path headers are not used.
  require_doc_code_correspondence: true

  # Require public declarations in supported source languages to have @implement
  require_public_func_annotation: true

  # Require related_files in legacy marker documents.
  # Self-describing documents deliberately omit repeated related_files metadata.
  require_related_files: true

  # Require @implement/@test/@test-contract annotations have identifiers
  require_annotation_identifier: true

  # Require each package docs directory to contain all four role documents
  require_pkg_doc_files: true

  # Require annotation types not split across consecutive lines
  # e.g., ALLOWED: // @test TEST-AUTH-001, TEST-AUTH-002
  # e.g., NOT ALLOWED: // @test TEST-AUTH-001 \n // @test TEST-AUTH-002
  require_annotation_on_same_line: true

  # Require recognized test declarations to have @test or @test-contract
  require_test_annotation: true

  # Optional lexical drift hint; this is not semantic proof
  consistency_check:
    enabled: false
    threshold: 0.3

# Output settings
output:
  # Output file path (default: stdout if empty, use -o flag to override)
  file: ""

  # Include full graph in report (default: false)
  include_graph: false

  # Verbose output (default: false)
  verbose: false
