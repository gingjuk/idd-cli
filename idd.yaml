version: "1.0"

docs:
  patterns:
    - "**/*.md"
  identifier_patterns:
    spec: "SPEC-[A-Z]+-\\d+"
    contract: "CONTRACT-[A-Z]+-\\d+"
    test: "TEST-[A-Z]+-\\d+"
    design: "DESIGN-[A-Z]+-\\d+"

code:
  patterns:
    - "**/*.go"
    - "**/*.ts"
    - "**/*.tsx"
    - "**/*.js"
  annotations:
    - "@spec"
    - "@contract"
    - "@test"
    - "@design"

validation:
  require_bidirectional: true
  allow_orphans: false
  require_spec_test_coverage: true

output:
  file: "idd-report.json"
  include_graph: false
  verbose: false