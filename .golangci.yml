version: "2"

output:
  formats:
    - format: colored-line-number
      print-issued-lines: true
      print-linter-name: true

linters:
  default: standard
  enable:
    - gosimple
    - staticcheck
    - unused
    - gofmt
    - goimports

linters-settings:
  gofmt:
    simplify: true
  goimports:
    local-prefixes: github.com/yourorg/idd-cli

run:
  timeout: 5m
  tests: false

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0
