version: "1.0"

docs:
  patterns:
    - "docs/**/*.md"
  identifier_patterns:
    spec: "SPEC-[A-Z]+-[0-9]+"
    contract: "CONTRACT-[A-Z]+-[0-9]+"
    test: "TEST-[A-Z]+-[0-9]+"
    design: "DESIGN-[A-Z]+-[0-9]+"
  ignore_paths:
    - "examples/**"

code:
  patterns:
    - "**/*.go"
  annotations:
    - "@spec"
    - "@contract"
    - "@test"
    - "@design"

validation:
  require_bidirectional: true
  allow_orphans: true
  require_spec_test_coverage: false
  require_doc_code_correspondence: false

output:
  file: "idd-report.json"
  include_graph: false
  verbose: true
